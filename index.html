<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Lovely – nơi chia sẻ yêu thương." />
    <title>Lovely</title>
    <link rel="icon" href="https://github.com/Panbap/anh/blob/main/icon1.png?raw=true" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Patrick+Hand&display=swap&subset=vietnamese">
    <style>
        :root {
            --env: #fcd9dd;
            --env-light: #fee6e8;
            --env-dark: #f6c7ce;
            --paper: #fffaf8;
            --ink: #3a2a31;
            --title: #c27766;
            --rose: #d63384;
            --muted: #8b6f77;
            --font-script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
            --font-hand: "Patrick Hand", "Segoe Print", "Comic Sans MS", system-ui, sans-serif;
            --vh: 1vh;
            --w: min(88vw, 400px, calc(var(--vh) * 52));
            --eh: calc(var(--w) * 0.62);
            /* chiều cao hàng hoa ở đáy màn hình */
            --floor: calc(84px + env(safe-area-inset-bottom, 0px));
        }

        /* dvh = chiều cao thật trên điện thoại (trừ thanh địa chỉ) */
        @supports (height: 1dvh) {
            :root { --vh: 1dvh; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {
            overflow: hidden;
            background: radial-gradient(ellipse 80% 65% at 50% 45%, #ffffff 0%, #fff5f7 55%, #fde4ea 100%) #fffafa;
            color: var(--ink);
            font-family: var(--font-hand);
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- hoa mọc ở đáy (scripts.js) ---------- */
        .flower {
            z-index: 1; transform-origin: bottom center; will-change: transform;
            animation: sway var(--dur, 4s) ease-in-out var(--delay, 0s) infinite alternate;
        }
        @keyframes sway {
            from { transform: rotate(calc(var(--amp, 8deg) * -1)); }
            to { transform: rotate(var(--amp, 8deg)); }
        }

        /* ---------- thư / quà rơi: chỉ trang trí, không bấm ---------- */
        .falling-letter {
            position: fixed;
            top: -100px;
            width: 50px;
            height: auto;
            z-index: 2;
            pointer-events: none;
            user-select: none;
            animation: fall 8s linear forwards;
            will-change: transform;
        }

        @keyframes fall {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
            20% { transform: translateY(20vh) translateX(-20px) rotate(-10deg); }
            40% { transform: translateY(40vh) translateX(15px) rotate(8deg); }
            60% { transform: translateY(60vh) translateX(-15px) rotate(-6deg); }
            80% { transform: translateY(80vh) translateX(10px) rotate(4deg); }
            100% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0.3; }
        }

        /* ---------- lớp chứa phong bì ---------- */
        .scene {
            position: fixed; inset: 0; z-index: 5; overflow: hidden;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        .center-gif {
            position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%;
            transform: translateX(-50%); width: 150px; max-width: 40vw; z-index: 0;
            pointer-events: none;
        }

        /* trạng thái do checkbox điều khiển: #openChk = đã mở thư, #readChk = đang đọc */
        .chk { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .open-cover { position: absolute; inset: 0; z-index: 10; cursor: pointer; }
        #openChk:checked ~ .open-cover { display: none; }
        /* khi đọc thư: thỏ vẫn hiện, nằm trước phong bì */
        #readChk:checked ~ .center-gif { z-index: 2; }

        .stage {
            position: absolute; left: 50%; top: 50%; z-index: 1;
            width: var(--w); height: var(--eh);
            margin-left: calc(var(--w) / -2); margin-top: calc(var(--eh) / -2);
            perspective: 900px;
            transition: transform 1.1s cubic-bezier(.6, .05, .3, 1);
        }
        #openChk:focus-visible ~ .stage .seal { outline: 2px solid var(--rose); outline-offset: 4px; border-radius: 50%; }
        #openChk:checked ~ .stage { transform: translateY(calc(var(--eh) * 0.3)); transition-delay: .65s; }
        /* khi đọc: đáy phong bì nằm trên hàng hoa ở đáy màn hình */
        #readChk:checked ~ .stage { transform: translateY(calc(var(--vh) * 50 - var(--floor) - var(--eh) / 2)); transition-delay: 0s; }

        .env-back {
            position: absolute; inset: 0; border-radius: 6px; background: var(--env-dark);
            box-shadow: 0 22px 44px -16px rgba(120, 60, 72, .4);
        }

        .carn-side {
            position: absolute; bottom: 58%; width: 30%; height: auto; aspect-ratio: 100 / 150; z-index: 3;
            transform: scale(0); transform-origin: 50% 100%; opacity: 1;
            transition: transform 1s cubic-bezier(.3, 1.45, .5, 1) 1s, opacity .5s;
        }
        .carn-side.l { left: -7%; --r: -14deg; }
        .carn-side.r { right: -7%; --r: 14deg; }
        #openChk:checked ~ .stage .carn-side { transform: scale(1) rotate(var(--r)); }

        .paper {
            position: absolute; left: 5%; right: 5%; bottom: 6%; height: 88%; z-index: 2;
            background: var(--paper); border-radius: 6px; border: 7px solid #f4b6c2;
            box-shadow: 0 4px 16px rgba(150, 80, 92, .16);
            transition: transform 1.4s cubic-bezier(.5, 0, .2, 1), height 1.1s cubic-bezier(.5, 0, .2, 1);
        }
        #openChk:checked ~ .stage .paper { transform: translateY(-62%); transition-delay: .65s; }

        /* bướm đậu hai bên mép thư: hiện sau khi thư trồi ra */
        .bfly {
            /* bề ngang bướm = 22% bề ngang thư (thư rộng 0.9 × --w), tính bằng px
               để left/top cùng một thước đo, không lệch khi màn hình hẹp */
            --bw: min(calc(var(--w) * 0.198), 88px);
            position: absolute; z-index: 4; width: var(--bw); height: auto;
            pointer-events: none; opacity: 0; transition: opacity .8s, top 1.1s cubic-bezier(.5, 0, .2, 1);
            transform: rotate(var(--r)) scaleX(var(--fx));
        }
        /* đặt thân bướm (b1: ~65%,70% ảnh; b2: ~40%,65% ảnh) đúng lên viền thư, cánh xoè ra ngoài */
        .bfly.l { left: calc(var(--bw) * -0.62); top: calc(var(--bw) * -0.64); --r: -10deg; --fx: 1; transform-origin: 65% 70%; }
        .bfly.r { right: calc(var(--bw) * -0.6); top: calc(var(--eh) * -0.04); --r: 8deg; --fx: 1; transform-origin: 40% 65%; }
        /* khi đọc: bướm phải hạ xuống giữa thư */
        #readChk:checked ~ .stage .bfly.r { top: 42%; transition-delay: 0s; }
        #openChk:checked ~ .stage .bfly { opacity: 1; transition-delay: 1.8s; animation: flutter 1.8s ease-in-out infinite; }
        #openChk:checked ~ .stage .bfly.l { animation-delay: -.6s; }
        @keyframes flutter {
            0%, 100% { transform: rotate(var(--r)) scaleX(var(--fx)); }
            50% { transform: rotate(var(--r)) scaleX(calc(var(--fx) * .78)) translateY(-3px); }
        }
        #readChk:checked ~ .stage .paper {
            height: calc(var(--vh) * 94 - var(--floor) - var(--eh) * 0.46 - 24px);
            transform: translateY(calc(var(--eh) * -0.4));
            transition-delay: 0s;
        }

        .cover {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            padding-top: 7%; text-align: center; line-height: 1.08;
            font-family: var(--font-script); font-weight: 500; color: var(--title);
            font-size: calc(var(--w) * 0.085);
            transition: opacity .5s;
        }
        .cover .date { font-weight: 700; font-size: 1.15em; margin-top: .1em; letter-spacing: .02em; }
        #readChk:checked ~ .stage .cover { opacity: 0; }

        .paper-body {
            position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
            --pt: 20px;
            /* --film-h: chiều cao dải ảnh, do scripts.js đo và gán */
            padding: calc(var(--film-h, 0px) + var(--pt)) 18px calc(var(--eh) * 0.38);
            font-size: clamp(16px, 4.6vw, 19px); line-height: 1.55; color: var(--ink);
            opacity: 0; pointer-events: none; transition: opacity .8s .8s;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        /* ẩn thanh cuộn nhưng vẫn cuộn được */
        .paper-body::-webkit-scrollbar, .film::-webkit-scrollbar { display: none; }
        .film { scrollbar-width: none; }
        #readChk:checked ~ .stage .paper-body,
        #readChk:checked ~ .stage .film { opacity: 1; pointer-events: auto; }
        .paper-body p { margin: 0 0 .7em; }
        /* lời chào + trái tim: căn giữa; hết chỗ thì từ tiếp theo mới xuống dòng */
        .paper-body .greet { text-align: center; line-height: 1.2; }
        .paper-body .greet-icon { font-size: .85em; vertical-align: .05em; }
        .end-img { display: block; width: 50%; max-width: 180px; height: auto; margin: 1em auto 0; }

        /* dải ảnh cuộn phim: đặt cố định ở đầu tờ thư, nằm ngoài vùng cuộn chữ */
        .film {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1;
            padding: 12px 0; overflow: hidden;
            opacity: 0; pointer-events: none; transition: opacity .8s .8s;
            box-shadow: 0 6px 10px -8px rgba(120, 60, 72, .25);
            background:
                radial-gradient(circle, #f1d3d9 2.2px, transparent 2.8px) 0 2px / 14px 8px repeat-x,
                radial-gradient(circle, #f1d3d9 2.2px, transparent 2.8px) 0 calc(100% - 2px) / 14px 8px repeat-x,
                #fff;
            border-block: 1px solid #f3dde1;
        }
        .film-track { display: flex; width: max-content; animation: film 22s linear infinite; }
        .film-frame {
            width: calc(var(--w) * 0.4); aspect-ratio: 4 / 3; margin-right: 10px; padding: 4px;
            background: #fff; border: 1px solid #e9dde0; box-shadow: 0 2px 6px rgba(120, 60, 72, .12);
        }
        .film-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @keyframes film { to { transform: translateX(-50%); } }
        .paper-body .greet { font-family: var(--font-script); font-weight: 700; font-size: 1.45em; color: var(--title); margin-bottom: .4em; }
        .paper-body .sign { font-family: var(--font-script); font-weight: 700; font-size: 1.35em; color: var(--title); text-align: right; margin-top: 1em; }

        .pk { position: absolute; inset: 0; pointer-events: none; }
        .pk.side { z-index: 3; background: var(--env); clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
        .pk.bottom-wrap { z-index: 3; filter: drop-shadow(0 -1px 1.5px rgba(170, 90, 100, .16)); }
        .pk.bottom { background: linear-gradient(to top, var(--env) 0%, var(--env-light) 100%); clip-path: polygon(0 100%, 50% 47%, 100% 100%); }

        .flap {
            position: absolute; left: 0; right: 0; top: 0; height: 60%; z-index: 4;
            transform-origin: 50% 0;
            filter: drop-shadow(0 2px 2px rgba(170, 90, 100, .2));
            transition: transform .8s cubic-bezier(.4, 0, .2, 1), z-index 0s .4s;
        }
        .flap i { position: absolute; inset: 0; background: linear-gradient(var(--env-light), var(--env)); clip-path: polygon(0 0, 100% 0, 50% 100%); }
        #openChk:checked ~ .stage .flap { transform: rotateX(180deg); z-index: 1; }

        .seal {
            position: absolute; left: 50%; top: 58%; width: 13%; z-index: 5;
            transform: translate(-50%, -50%); transition: opacity .3s, transform .3s;
        }
        .seal svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 2px 2px rgba(180, 60, 80, .3)); }
        #openChk:not(:checked) ~ .stage .seal svg { animation: beat 1.5s ease-in-out infinite; }
        #openChk:checked ~ .stage .seal { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.18); }
            30% { transform: scale(1); }
            45% { transform: scale(1.12); }
        }

        /* trang trí khi đọc: bó hoa + ảnh polaroid trên mặt phong bì */
        .deco { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .8s 1s; }
        #readChk:checked ~ .stage .deco { opacity: 1; }
        #readChk:checked ~ .stage .carn-side { opacity: 0; transition-delay: 0s; }
        .bouquet { position: absolute; left: 3%; bottom: 3%; width: 34%; height: auto; transform: rotate(-6deg); filter: drop-shadow(0 4px 6px rgba(120, 60, 72, .18)); }
        .polaroid {
            position: absolute; right: 4%; bottom: 4%; width: 40%; padding: 3.5% 3.5% 10%;
            background: #fff; box-shadow: 0 6px 14px rgba(100, 50, 60, .22); transform: rotate(6deg);
        }
        .polaroid .ph { aspect-ratio: 1; max-width: 100%; overflow: hidden; background: #fbe0e4; }
        .polaroid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .6s; }
        .polaroid .mini { position: absolute; right: 9%; bottom: 3%; width: 12%; color: var(--ink); opacity: .6; }

        /* ---------- gợi ý ---------- */
        .tap-hint {
            position: absolute; left: 50%; top: calc(100% + 30px); transform: translateX(-50%);
            white-space: nowrap; color: var(--rose); font-size: 20px; font-weight: bold; letter-spacing: .02em;
            transition: opacity .4s;
        }
        #openChk:checked ~ .stage .tap-hint { opacity: 0; }

        .swipe-hint {
            position: absolute; left: 50%; top: calc(50% + var(--eh) * 0.8 + 20px); z-index: 3;
            transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            font-size: 19px; font-weight: bold; color: var(--rose); white-space: nowrap;
            cursor: pointer; transition: opacity .5s, transform .5s;
        }
        #openChk:checked ~ .swipe-hint { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; transition-delay: 2.2s; }
        #readChk:checked ~ .swipe-hint { opacity: 0; pointer-events: none; transition-delay: 0s; }
        .swipe-hint svg { width: 26px; height: 26px; animation: up 1.3s ease-in-out infinite; }
        .swipe-hint svg + svg { margin-top: -16px; animation-delay: .15s; opacity: .6; }
        @keyframes up {
            0%, 100% { transform: translateY(6px); }
            50% { transform: translateY(-4px); }
        }

        @media (max-height: 700px) {
            .film { padding: 9px 0; }
            .film-frame { width: calc(var(--w) * 0.3); padding: 3px; margin-right: 8px; }
            .paper-body { --pt: 14px; font-size: 16px; line-height: 1.5; }
            .paper-body .greet { font-size: 1.3em; }
            .center-gif { width: 110px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage, .paper, .flap, .carn-side, .cover, .paper-body, .deco { transition-duration: .01s !important; transition-delay: 0s !important; }
            .seal svg, .swipe-hint svg, .film-track, .bfly { animation: none !important; }
            .film { overflow-x: auto; }
        }
    </style>
</head>

<body>

        <defs>

                <path d="M51 100 C68 85 82 87 95 95 C81 104 64 106 51 100Z" fill="#5c9a48" />

                <path d="M12 46 Q16 29 28 34 Q29 18 42 25 Q50 12 58 25 Q71 18 72 34 Q84 29 88 46 Q81 61 66 58 Q58 67 50 60 Q42 67 34 58 Q19 61 12 46Z" fill="#f29fb0" />
                <path d="M22 44 Q26 31 37 36 Q43 25 50 33 Q57 25 63 36 Q74 31 78 44 Q67 53 50 48 Q33 53 22 44Z" fill="#f8b9c6" />
                <path d="M33 40 Q41 31 50 37 Q59 31 67 40 Q59 45 50 42 Q41 45 33 40Z" fill="#fcd5dc" />
                <path d="M16 47 Q23 53 30 50 M70 50 Q77 53 84 47 M38 57 Q44 52 50 57 Q56 52 62 57 M30 38 Q34 35 38 38 M62 38 Q66 35 70 38" stroke="#e5869a" stroke-width="1.4" fill="none" stroke-linecap="round" />
            </symbol>

                <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.2 3 4.5 6.6 4.5c2.2 0 3.6 1.3 4.4 2.6.8-1.3 2.2-2.6 4.4-2.6 3.6 0 5.7 3.7 4.2 7.3C19.5 16.4 12 21 12 21z" />
            </symbol>
        </defs>
    </svg>

    <!-- Nhạc nền: phát khi chạm lần đầu -->
    <audio id="player" src="./assets/a.mp3" loop preload="none"></audio>

    <!-- Phong bì ở giữa -->
    <main class="scene" id="scene">
        <input type="checkbox" class="chk" id="openChk" aria-label="Mở thư">
        <input type="checkbox" class="chk" id="readChk" aria-label="Đọc thư">
        <label class="open-cover" for="openChk" aria-hidden="true"></label>

        <!-- Ảnh động trang trí -->
        <img src="./assets/mewmew.gif" alt="" class="center-gif" />

        <div class="stage" id="stage">
            <div class="env-back"></div>
            <div class="flap"><i></i></div>

            <article class="paper">
                <div class="cover" aria-hidden="true">
                    <span>Happy</span>
                    <span>Birthday</span>
                    <span class="date">♥</span>
                </div>
                <div class="paper-body" id="letterBody"></div>
                <img class="bfly l" src="./assets/b1.png" alt="">
                <img class="bfly r" src="./assets/b2.png" alt="">
            </article>

            <svg class="carn-side l" viewBox="0 0 100 150" aria-hidden="true"><use href="#carn" /></svg>
            <svg class="carn-side r" viewBox="0 0 100 150" aria-hidden="true"><use href="#carn" /></svg>

            <div class="pk side"></div>
            <div class="pk bottom-wrap"><div class="pk bottom"></div></div>

            <div class="seal" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="#ec6d7f"><use href="#heart" /></svg>
            </div>

            <div class="deco">

                <img class="bouquet" src="./assets/h1.png" alt="">

                <div class="polaroid">
                    <div class="ph"><img id="polaroidImg" src="./assets/a1.jpg" alt="Ảnh kỷ niệm"></div>
                    <svg class="mini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#heart" /></svg>
                </div>
            </div>

            <div class="tap-hint">Chạm vào thư nhé</div>
        </div>

        <label class="swipe-hint" for="readChk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6" /></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6" /></svg>
            <span>Vuốt lên để đọc thư</span>
        </label>
    </main>

    <script src="./assets/scripts.js?v=2.0"></script>
</body>
